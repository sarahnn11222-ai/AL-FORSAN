<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلب الانضمام | الفرسان</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="brand">

            <span>الفرسان</span>

            <img src="images/logo.png" alt="شعار الفرسان">

        </div>

    </header>

    <main class="apply-page">

        <h1>طلب الانضمام إلى الفرسان</h1>

        <p>نرحب بك! أجب عن الأسئلة التالية لإرسال طلبك.</p>

        <form id="applicationForm">

         Meta Gaming - ميتا قيمينق

    </label>

    <label>

        <input type="radio" name="q8" value="لا أعرف">

        لا أعرف

    </label>

</div>

<!-- السؤال 9 -->

<div class="question">

    <label>

        إذا تعرضت للقتل (Player Kill)، كيف يجب أن تتصرف بعد الرسپاون؟

    </label>

    <label>

        <input type="radio" name="q9" value="أعود مباشرة للعب" required>

        أعود مباشرة للعب

    </label>

    <label>

        <input type="radio" name="q9" value="أمثل فترة العلاج والإصابة حسب شدة الموقف">

        أمثل فترة العلاج والإصابة حسب شدة الموقف

    </label>

    <label>

        <input type="radio" name="q9" value="أهاجم القاتلين بعد الرسپاون">

        أهاجم القاتلين بعد الرسپاون

    </label>

    <label>

        <input type="radio" name="q9" value="لا أعرف">

        لا أعرف
    </label>
    
          <!-- السؤال 10 -->

<div class="question">

  <label for="q10">

    السؤال 10: إذا اصطدمت بمركبة أخرى وأصيب لاعب، كيف يجب أن تتصرف؟

  </label>

  <textarea id="q10" name="q10" required></textarea>

</div>

<!-- السؤال 11 -->

<div class="question">

  <label for="q11">

    السؤال 11: ضع مثالًا على تطور شخصية (Character Development) داخل اللعبة.

  </label>

  <textarea id="q11" name="q11" required></textarea>

</div>

<!-- السؤال 12 -->

<div class="question">

  <label for="q12">

    السؤال 12: لماذا تريد الدخول إلى مجتمع سدير؟

  </label>

  <textarea id="q12" name="q12" required></textarea>

</div>

<!-- السؤال 13 -->

<div class="question">

  <label for="q13">

    السؤال 13: اسم شخصيتك المطلوبة (يجب أن يكون الاسم واقعيًا، اسم أول وثاني فقط).

  </label>

  <textarea id="q13" name="q13" required></textarea>

</div>

<!-- السؤال 14 -->

<div class="question">

  <label for="q14">

    السؤال 14: كم عمرك الحقيقي؟

  </label>

  <input type="number" id="q14" name="q14" min="1" required>

</div>

<!-- السؤال 15 -->

<div class="question">

  <label for="q15">

    السؤال 15: لماذا يعتبر الالتزام بالتمثيل (Roleplay) طوال الوقت مهم داخل مفهومك؟

  </label>

  <textarea id="q15" name="q15" required></textarea>

</div>

<!-- السؤال 16 -->

<div class="question">

  <label for="q16">

    السؤال 16: اكتب هنا قصة شخصيتك وتوجهها داخل سدير، وكيف نشأت الشخصية وماذا حصل لها وما هدفها.

  </label>

  <textarea id="q16" name="q16" required></textarea>

</div>   

            <button type="submit">إرسال الطلب</button>

        </form>

    </main>

</body>

</html>
